  <polygon points="65,92 67,97 72,97 68,100 70,105 65,102 60,105 62,100 58,97 63,97" fill="#f59e0b" />
  <polygon points="135,92 137,97 142,97 138,100 140,105 135,102 130,105 132,100 128,97 133,97" fill="#f59e0b" />

  <!-- Banner Text -->
  <text x="100" y="142" font-family="sans-serif" font-size="10" font-weight="800" fill="#15803d" text-anchor="middle" letter-spacing="1">STUDENT COUNCIL</text>
  <text x="100" y="156" font-family="sans-serif" font-size="7.5" font-weight="700" fill="#047857" text-anchor="middle" letter-spacing="0.5">LEADERSHIP • ACTION</text>
  <text x="100" y="168" font-family="sans-serif" font-size="6.5" font-weight="600" fill="#64748b" text-anchor="middle">PES MCOE PUNE</text>
</svg>
