<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="councilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <!-- Circular Seal Outer Ring -->
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#16a34a" stroke-width="4" />
  <circle cx="100" cy="100" r="82" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <!-- Central Emblem: Student Leadership Hands / Leaf & Star -->
  <circle cx="100" cy="92" r="32" fill="url(#councilGrad)" />
