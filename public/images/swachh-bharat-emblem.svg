<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="100%" height="100%">
  <defs>
    <linearGradient id="flagSaffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="flagGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <!-- Left Spectacle Frame (Swachh) -->
  <circle cx="65" cy="46" r="32" fill="#ffffff" stroke="url(#flagGreen)" stroke-width="4.5" />
  <text x="65" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#15803d" text-anchor="middle" letter-spacing="1">स्वच्छ</text>

  <!-- Bridge -->
  <path d="M97 44 C110 32, 130 32, 143 44" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" />

  <!-- Right Spectacle Frame (Bharat) -->
  <circle cx="175" cy="46" r="32" fill="#ffffff" stroke="url(#flagGreen)" stroke-width="4.5" />
  <text x="175" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#15803d" text-anchor="middle" letter-spacing="1">भारत</text>

  <!-- Subtitle -->
  <text x="120" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="1.5">एक कदम स्वच्छता की ओर</text>

  <!-- Saffron & Green Accent Dots -->
  <circle cx="120" cy="22" r="3" fill="#ea580c" />
</svg>
